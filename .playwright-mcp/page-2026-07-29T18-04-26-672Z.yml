          - generic [ref=f6e47]:
            - heading "Welcome to NF Shop 24" [level=2] [ref=f6e48]
            - paragraph [ref=f6e49]: NF Shop 24 is Bangladesh's trusted e-commerce destination, offering quality products at unbeatable prices with hassle-free delivery across the country.
            - heading "Our Story" [level=2] [ref=f6e50]
            - paragraph [ref=f6e51]: NF Shop 24 started with a simple mission — to make quality products accessible to every Bangladeshi at fair prices. What began as a small online store has grown into a trusted national e-commerce platform serving thousands of happy customers. We partner directly with trusted brands and local suppliers to ensure every product meets our quality standards.
            - heading "Our Mission" [level=2] [ref=f6e52]
            - paragraph [ref=f6e53]: To provide every Bangladeshi with access to quality products at the best prices, delivered reliably to their doorstep.
            - heading "Our Vision" [level=2] [ref=f6e54]
            - paragraph [ref=f6e55]: To become Bangladesh's most trusted e-commerce platform, setting the standard for quality, service, and customer satisfaction.
            - heading "Our Values" [level=2] [ref=f6e56]
            - paragraph [ref=f6e57]: Integrity, transparency, and putting our customers first in everything we do.
            - heading "Why Choose Us" [level=2] [ref=f6e58]
            - list [ref=f6e59]:
              - listitem [ref=f6e60]:
                - strong [ref=f6e61]: Secure Shopping
                - text: — Pay only when you receive your product. Your satisfaction is guaranteed.
              - listitem [ref=f6e62]:
                - strong [ref=f6e63]: Fast Delivery
                - text: — Nationwide delivery network ensuring your order reaches you on time.
              - listitem [ref=f6e64]:
                - strong [ref=f6e65]: 24/7 Support
                - text: — Dedicated customer service team ready to help you anytime.
              - listitem [ref=f6e66]:
                - strong [ref=f6e67]: Easy Returns
                - text: — Hassle-free return policy. If you're not satisfied, we'll make it right.
              - listitem [ref=f6e68]:
                - strong [ref=f6e69]: Best Prices
                - text: — Direct partnerships with brands and suppliers mean lower prices for you.
              - listitem [ref=f6e70]:
                - strong [ref=f6e71]: Trusted Quality
                - text: — Every product is verified for quality before it reaches our customers.
