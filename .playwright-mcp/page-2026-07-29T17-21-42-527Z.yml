          - generic [ref=f7e30]: 
          - text: Frequently Asked Questions
        - paragraph [ref=f7e31]: Answers to common questions about ordering, shipping, and returns
      - generic [ref=f7e35]:
        - heading "Ordering" [level=2] [ref=f7e36]
        - heading "How do I place an order?" [level=3] [ref=f7e37]
        - paragraph [ref=f7e38]: Browse our products, add the items you want to your cart, and proceed to checkout. Fill in your delivery details and choose a payment method to confirm your order.
        - heading "Can I change or cancel my order after placing it?" [level=3] [ref=f7e39]
        - paragraph [ref=f7e40]: Orders can be canceled within 24 hours of placement. Please contact us as soon as possible with your order ID — once an order has shipped, it can no longer be changed or canceled.
        - heading "Payment" [level=2] [ref=f7e41]
        - heading "What payment methods do you accept?" [level=3] [ref=f7e42]
        - paragraph [ref=f7e43]: We accept Cash on Delivery (COD), bKash, Nagad, Rocket, and Bank Transfer.
        - heading "Is it safe to pay online on your site?" [level=3] [ref=f7e44]
        - paragraph [ref=f7e45]: Yes. Online payments are processed securely through trusted third-party payment gateways — we never store your card or mobile banking credentials.
        - heading "Shipping & Delivery" [level=2] [ref=f7e46]
        - heading "How long does delivery take?" [level=3] [ref=f7e47]
        - paragraph [ref=f7e48]: Delivery typically takes 2–5 business days within Bangladesh, depending on your location.
        - heading "Do you offer free shipping?" [level=3] [ref=f7e49]
        - paragraph [ref=f7e50]: Yes, we offer free shipping on orders above a minimum amount. The exact threshold is shown at checkout.
        - heading "How can I track my order?" [level=3] [ref=f7e51]
        - paragraph [ref=f7e52]:
          - text: Use the
          - link "Track Order" [ref=f7e53] [cursor=pointer]:
            - /url: http://localhost/track-order
          - text: page with your order ID to check the latest status, or log in to your account to view your order history.
        - heading "Returns & Refunds" [level=2] [ref=f7e54]
        - heading "What is your return policy?" [level=3] [ref=f7e55]
        - paragraph [ref=f7e56]:
          - text: We accept returns within 7 days of delivery for unused products in their original packaging. See our full
          - link "Refund & Return Policy" [ref=f7e57] [cursor=pointer]:
            - /url: http://localhost/refund-policy
          - text: for details.
        - heading "How long do refunds take?" [level=3] [ref=f7e58]
        - paragraph [ref=f7e59]: Once your return is approved, refunds or replacements are processed within 5–7 business days.
        - heading "Account" [level=2] [ref=f7e60]
        - heading "Do I need an account to place an order?" [level=3] [ref=f7e61]
        - paragraph [ref=f7e62]: No, you can check out as a guest. Creating an account lets you track orders, save your details for faster checkout, and view your order history.
        - heading "I forgot my password. What do I do?" [level=3] [ref=f7e63]
        - paragraph [ref=f7e64]: Use the "Forgot password" link on the login page to reset it via email.
        - heading "Still have questions?" [level=2] [ref=f7e65]
        - paragraph [ref=f7e66]:
          - text: Reach out to us on our
          - link "Contact Us" [ref=f7e67] [cursor=pointer]:
            - /url: http://localhost/contact
          - text: page — we're happy to help.
