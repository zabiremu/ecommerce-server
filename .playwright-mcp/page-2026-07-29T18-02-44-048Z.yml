            - heading "Welcome to NF Shop 24" [level=2] [ref=e48]
            - paragraph [ref=e49]: NF Shop 24 is Bangladesh's trusted e-commerce destination, offering quality products at unbeatable prices with hassle-free delivery across the country.
            - heading "Our Story" [level=2] [ref=e50]
            - paragraph [ref=e51]: NF Shop 24 started with a simple mission — to make quality products accessible to every Bangladeshi at fair prices. What began as a small online store has grown into a trusted national e-commerce platform serving thousands of happy customers. We partner directly with trusted brands and local suppliers to ensure every product meets our quality standards.
            - heading "Our Mission" [level=2] [ref=e52]
            - paragraph [ref=e53]: To provide every Bangladeshi with access to quality products at the best prices, delivered reliably to their doorstep.
            - heading "Our Vision" [level=2] [ref=e54]
            - paragraph [ref=e55]: To become Bangladesh's most trusted e-commerce platform, setting the standard for quality, service, and customer satisfaction.
            - heading "Our Values" [level=2] [ref=e56]
            - paragraph [ref=e57]: Integrity, transparency, and putting our customers first in everything we do.
